services:
  - type: web
    name: barbearia-bh
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CALENDAR_ID
        sync: false
      - key: TIMEZONE
        value: Europe/Lisbon
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
